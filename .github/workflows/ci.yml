name: Verify Fava

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            runner/package-lock.json
      - run: npm ci --prefix web
      - run: npm ci --prefix runner
      - run: npm test
      - run: python3 -m unittest infra/cloudflare/test_schema.py
      - run: npm run lint --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run typecheck --prefix runner
      - run: npm run build:vinext --prefix web -- --logLevel=error
      - name: Verify native Worker bindings
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const root = 'web/.cloudflare/output/v0/workers/default/bundle/';
          const manifest = JSON.parse(readFileSync(root + '.vite/manifest.json', 'utf8'));
          const route = manifest['app/api/github/route.ts']?.file;
          assert(route, 'GitHub API route missing from Worker build');
          assert(/from["']cloudflare:workers["']/.test(readFileSync(root + route, 'utf8')),
            'GitHub API route must import native Cloudflare bindings');
          NODE
      - run: |
          # Docker Hub can time out while resolving Cloudflare's sandbox-shim image.
          for attempt in 1 2 3; do
            npm run build:dry --prefix runner && exit 0
            sleep 15
          done
          exit 1
