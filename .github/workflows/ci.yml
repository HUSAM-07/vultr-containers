name: Verify Fava

on:
  pull_request:
  push:
    branches:
      - feat/agent-rush-platform

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            runner/package-lock.json
      - run: npm ci --prefix web
      - run: npm ci --prefix runner
      - run: npm test
      - run: python3 -m unittest infra/cloudflare/test_schema.py
      - run: npm run lint --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run typecheck --prefix runner
      - run: npm run build:vinext --prefix web -- --logLevel=error
      - run: npm run build:dry --prefix runner
